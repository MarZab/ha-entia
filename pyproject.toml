[project]
name = "ha-entia"
version = "0.1.0"
description = "Home Assistant integration for Entia Living smart homes"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# a hung test (e.g. a session that never closes) fails instead of blocking the run
timeout = 30

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "PYI", "RUF"]
