# Configuration for the development instance in compose.yaml
default_config:

logger:
  default: warning
  logs:
    # Logs every request/response with the Entia server as an "Exchange {json}" line
    custom_components.entia: debug
    # Show when integrations and config entries are set up, reloaded and unloaded
    homeassistant.setup: info
    homeassistant.bootstrap: info
    homeassistant.config_entries: info
